
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP not found"
            exit 1
          fi
          mkdir -p project
          unzip -oq "$ZIP" -d project

      - name: Remove BOM from Java files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project/MatreshkaTruckHelper")
          if not root.exists():
              raise SystemExit("ERROR: Project folder not found")

          fixed = 0
          for file in root.rglob("*.java"):
              data = file.read_bytes()
              if data.startswith(b"\xef\xbb\xbf"):
                  file.write_bytes(data[3:])
                  print("BOM removed:", file)
                  fixed += 1

          print("Files fixed:", fixed)
          PY

      - name: Verify Java files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("project/MatreshkaTruckHelper")
          bad = [
              str(f) for f in root.rglob("*.java")
              if f.read_bytes().startswith(b"\xef\xbb\xbf")
          ]

          if bad:
              print("BOM STILL FOUND:", *bad, sep="\n")
              raise SystemExit(1)

          print("SUCCESS: ALL JAVA FILES ARE CLEAN")
          PY

      - name: Build APK
        run: |
          cd project/MatreshkaTruckHelper
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Matreshka-Truck-Helper-APK
          path: project/MatreshkaTruckHelper/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
