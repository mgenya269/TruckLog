
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -iname '*.zip' -print -quit)
          test -n "$ZIP"
          mkdir project
          unzip -q "$ZIP" -d project

      - name: Build APK
        run: |
          cd project/MatreshkaTruckHelper
          gradle assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: Matreshka-Truck-Helper-APK
          path: project/MatreshkaTruckHelper/app/build/outputs/apk/debug/app-debug.apk
