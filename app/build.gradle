plugins {
    id 'com.android.application'
}

android {
    namespace 'com.matreshka.truckhelper'
    compileSdk 35

    defaultConfig {
        applicationId 'com.matreshka.truckhelper'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Включаем R8: сжатие, обфускация и оптимизация кода
            minifyEnabled true
            // Удаляем неиспользуемые ресурсы (картинки, строки)
            shrinkResources true
            // Правила по умолчанию + твой файл (создадим ниже)
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
